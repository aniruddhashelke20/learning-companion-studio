services:
  - type: web
    name: learning-companion-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false        # paste your MongoDB Atlas connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false        # set to your Vercel client URL, e.g. https://learning-companion-studio.vercel.app
      - key: GOOGLE_SHEET_WEBHOOK_URL
        sync: false        # optional
